{{- if and (eq .Values.demis.enabled true) (eq .Values.demis.auditLogs.fssrEnabled true) }}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: als-fssr-allow-access-from-fss-reader
  labels:
    component: audit-log
spec:
  selector:
    matchLabels:
      app: audit-log-service-fssr
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ $.Release.Namespace }}/sa/fhir-storage-reader-*"
      to:
        - operation:
            ports: ["50051"]
{{- end }}
